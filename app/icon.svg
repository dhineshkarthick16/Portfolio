<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- External IC Pins (Metallic Gold) -->
  <!-- Top Pins -->
  <rect x="20" y="2" width="6" height="7" rx="1.5" fill="url(#pinGold)" />
  <rect x="38" y="2" width="6" height="7" rx="1.5" fill="url(#pinGold)" />
  <!-- Bottom Pins -->
  <rect x="20" y="55" width="6" height="7" rx="1.5" fill="url(#pinGold)" />
  <rect x="38" y="55" width="6" height="7" rx="1.5" fill="url(#pinGold)" />
  <!-- Left Pins -->
  <rect x="2" y="20" width="7" height="6" rx="1.5" fill="url(#pinGold)" />
  <rect x="2" y="38" width="7" height="6" rx="1.5" fill="url(#pinGold)" />
  <!-- Right Pins -->
  <rect x="55" y="20" width="7" height="6" rx="1.5" fill="url(#pinGold)" />
  <rect x="55" y="38" width="7" height="6" rx="1.5" fill="url(#pinGold)" />

  <!-- Microchip Package Body (Obsidian Silicon) -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#0B0F12" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle Internal Circuit Border -->
  <rect x="11" y="11" width="42" height="42" rx="6" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.35" />

  <!-- Pin 1 Orientation Notch -->
  <circle cx="15" cy="15" r="2" fill="#10B981" fill-opacity="0.9" />

  <!-- Trace Accents -->
  <path d="M 12 28 L 17 28 L 20 31" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />
  <path d="M 52 36 L 47 36 L 44 33" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />

  <!-- Monogram DK Typography -->
  <text 
    x="32" 
    y="39" 
    font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace, sans-serif" 
    font-size="22" 
    font-weight="900" 
    letter-spacing="-1"
    text-anchor="middle" 
    fill="url(#dkGradient)"
    filter="url(#glow)">DK</text>
</svg>
