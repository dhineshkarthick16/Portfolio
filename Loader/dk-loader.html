<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhinesh Karthick - Portfolio Loader</title>
<style>
  body {
    margin: 0;
    background: #05080a;
    color: #cfe;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .site {
    padding: 60px 40px;
    max-width: 800px;
    margin: 0 auto;
  }
  .site h1 {
    font-size: 2.2rem;
    color: #3ee6f0;
    margin-bottom: 8px;
  }
  .site p {
    color: #94a3b8;
    line-height: 1.6;
  }

  /* ---------- DK LOADER: CSS ---------- */
  .dk-loader {
    --dk-cyan: #3ee6f0;
    --dk-blue: #38bdf8;
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at center, #09121a 0%, #05080a 75%);
    transition: opacity .8s cubic-bezier(0.4, 0, 0.2, 1), visibility .8s;
  }
  .dk-loader.done {
    opacity: 0;
    visibility: hidden;
  }

  .dk-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    max-width: 680px;
    padding: 20px;
  }

  /* Captions */
  .dk-caption {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease, transform .8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .dk-caption-top {
    font-size: clamp(0.72rem, 1.8vw, 0.88rem);
    color: rgba(62, 230, 240, 0.75);
    transform: translateY(12px);
    transition-delay: .5s;
  }
  .dk-caption-bottom {
    font-size: clamp(0.88rem, 2.2vw, 1.15rem);
    color: #e2e8f0;
    letter-spacing: 0.22em;
    transform: translateY(-12px);
    transition-delay: .7s;
    text-shadow: 0 0 14px rgba(62, 230, 240, 0.35);
  }
  .dk-loader.drawing .dk-caption,
  .dk-loader.done .dk-caption {
    opacity: 1;
    transform: translateY(0);
  }

  /* Logo SVG */
  .dk-logo {
    width: min(84vw, 500px);
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 8px rgba(62,230,240,.4));
    transition: filter .75s ease, transform .75s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .dk-loader.drawing .dk-logo {
    filter: drop-shadow(0 0 16px rgba(62,230,240,.85)) drop-shadow(0 0 32px rgba(56,189,248,.45));
  }
  .dk-loader.done .dk-logo {
    transform: scale(1.03);
    filter: drop-shadow(0 0 24px rgba(62,230,240,.95)) drop-shadow(0 0 48px rgba(56,189,248,.65));
  }

  /* D group: starts centered as a balanced smooth infinity spinner, then glides left on load */
  .dk-group-d {
    transform-origin: 248.5px 178px;
    transform: translate(126.5px, 22px) scale(0.72);
    transition: transform .85s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .dk-loader.drawing .dk-group-d,
  .dk-loader.done .dk-group-d {
    transform: translate(0, 0) scale(1);
  }

  /* K group: hidden during spin, reveals as D shifts */
  .dk-group-k {
    opacity: 0;
    transition: opacity .5s ease .2s;
  }
  .dk-loader.drawing .dk-group-k,
  .dk-loader.done .dk-group-k {
    opacity: 1;
  }

  /* Faint blueprint guide track during loading */
  .dk-blueprint {
    fill: none;
    stroke: var(--dk-cyan);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.12;
    transition: opacity .5s ease;
  }
  .dk-loader.drawing .dk-blueprint,
  .dk-loader.done .dk-blueprint {
    opacity: 0;
  }

  /* Orbital comet particle dots */
  .dk-dots {
    transition: opacity .45s ease;
  }
  .dk-dots circle {
    fill: var(--dk-cyan);
  }
  .dk-loader.drawing .dk-dots,
  .dk-loader.done .dk-dots {
    opacity: 0;
  }

  /* Solid calligraphy strokes */
  .dk-stroke {
    fill: none;
    stroke: var(--dk-cyan);
    stroke-width: 5.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    opacity: 0;
  }
  .dk-loader.drawing .dk-stroke,
  .dk-loader.done .dk-stroke {
    opacity: 1;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset .85s cubic-bezier(.55, 0, .15, 1), opacity .3s ease;
  }

  /* Sequential calligraphy timing */
  .dk-loader.drawing .dk-d {
    transition-delay: 0s;
  }
  .dk-loader.drawing .dk-k1 {
    transition-delay: .45s;
  }
  .dk-loader.drawing .dk-k2 {
    transition-delay: .75s;
  }
  .dk-loader.drawing .dk-k3 {
    transition-delay: .95s;
  }

  @media (prefers-reduced-motion: reduce) {
    .dk-loader.drawing .dk-stroke {
      transition: none;
      stroke-dashoffset: 0;
      opacity: 1;
    }
    .dk-group-d {
      transition: none;
      transform: translate(0, 0) scale(1);
    }
  }
</style>
</head>
<body>

<div class="site">
  <h1>Dhinesh Karthick</h1>
  <p>Your portfolio loaded successfully. The loader replica has dissolved.</p>
</div>

<!-- ---------- DK LOADER: JS ---------- -->
<script>
(function () {
  var MIN_SPIN_MS = 2000;
  var DOT_COUNT = 104;
  var SPEED = 0.045;

  var loader = document.getElementById('dkLoader');
  var path = document.getElementById('dkPath');
  var group = document.getElementById('dkDots');
  var NS = 'http://www.w3.org/2000/svg';
  var len = path.getTotalLength();
  var dots = [];

  for (var i = 0; i < DOT_COUNT; i++) {
    var p = path.getPointAtLength(len * i / DOT_COUNT);
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', p.x.toFixed(2));
    c.setAttribute('cy', p.y.toFixed(2));
    c.setAttribute('r', '1');
    c.setAttribute('opacity', '0.08');
    group.appendChild(c);
    dots.push(c);
  }

  var raf, start = performance.now();
  function frame(now) {
    var head = ((now - start) * SPEED) % DOT_COUNT;
    for (var i = 0; i < DOT_COUNT; i++) {
      var behind = ((head - i) % DOT_COUNT + DOT_COUNT) % DOT_COUNT / DOT_COUNT;
      var k = Math.pow(1 - behind, 2.3);
      dots[i].setAttribute('r', (0.8 + 4.2 * k).toFixed(2));
      dots[i].setAttribute('opacity', (0.07 + 0.93 * k).toFixed(2));
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  document.documentElement.style.overflow = 'hidden';

  var pageReady = new Promise(function (res) {
    if (document.readyState === 'complete') res();
    else window.addEventListener('load', res);
  });
  var minWait = new Promise(function (res) { setTimeout(res, MIN_SPIN_MS); });

  Promise.all([pageReady, minWait]).then(function () {
    loader.classList.add('drawing');
    setTimeout(function () {
      loader.classList.add('done');
    }, 2700);
    setTimeout(function () {
      cancelAnimationFrame(raf);
      loader.remove();
      document.documentElement.style.overflow = '';
    }, 3600);
  });
})();
</script>
